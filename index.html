<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>冠军骰子 · 巨星之路</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a3a1a; font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        #game-container { width: 100%; max-width: 440px; background: linear-gradient(180deg, #2d5a1e 0%, #1a4010 100%); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); padding: 16px; display: flex; flex-direction: column; border: 3px solid #ffffff; position: relative; overflow: hidden; min-height: 90vh; max-height: 95vh; }
        #game-container::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1e4a12 0%, #2d5a1e 60%); opacity: 0.3; pointer-events: none; }
        .fullscreen-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,25,10,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; border-radius: 24px; backdrop-filter: blur(8px); transition: opacity 0.5s ease; }
        .hidden-panel { opacity: 0; pointer-events: none; transform: scale(0.96); }
        .title { font-size: 2.8rem; font-weight: 900; color: #f7e05e; text-shadow: 0 0 15px #c9a227; margin-bottom: 8px; }
        .subtitle { color: #c0b87a; font-size: 1rem; margin-bottom: 30px; }
        .input-name { background: #1a2a1a; border: 2px solid #6b8c42; border-radius: 30px; padding: 12px; font-size: 1.2rem; color: #f0e6b2; text-align: center; outline: none; width: 80%; margin-bottom: 25px; font-weight: bold; }
        .btn { background: linear-gradient(180deg, #4a6e2a 0%, #2a4a1a 100%); border: 1px solid #7a9e4a; border-radius: 30px; padding: 10px 16px; font-size: 0.85rem; font-weight: bold; color: #f5e7b3; box-shadow: 0 4px 0 #1a2e0e; cursor: pointer; margin: 4px; white-space: normal; word-break: break-word; max-width: 95%; text-align: left; line-height: 1.3; transition: 0.08s; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1a2e0e; }
        .btn:disabled { opacity: 0.5; transform: none; box-shadow: 0 4px 0 #1a2e0e; cursor: not-allowed; }
        #header { display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.35); border-radius: 16px; padding: 6px 4px; margin-bottom: 8px; backdrop-filter: blur(8px); border: 1px solid #4a6b3a; }
        .header-item { text-align: center; color: #c0b87a; font-size: 0.7rem; }
        .header-item span { display: block; font-size: 1.1rem; font-weight: bold; color: #f5e7b3; }
        #btn-view-talents { font-size: 0.7rem; padding: 4px 10px; margin: 0; border-radius: 12px; background: #3a5a2a; color: #f5e7b3; border: 1px solid #6b8c42; cursor: pointer; }
        #progress-bar { display: flex; align-items: center; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 4px 10px; margin: 4px 0; border: 1px solid #6b8c42; font-size: 0.7rem; color: #e0d7a0; gap: 6px; }
        .progress-dot { width: 16px; height: 16px; background: #3a5a2a; border-radius: 50%; display: inline-block; border: 1px solid #4a6b3a; }
        .progress-dot.active { background: #ffd966; box-shadow: 0 0 8px #ff9900; border-color: #ffcc00; }
        .progress-dot.buff-slot {
            width: 0; height: 0;
            background: transparent; border: none;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid #4a9eff;
            box-shadow: none;
            border-radius: 0;
        }
        .progress-dot.buff-slot.claimed {
            border-bottom-color: #3a5a2a;
        }
        #output-area { flex: 1; background: rgba(8,18,8,0.7); border-radius: 16px; padding: 10px; overflow-y: auto; margin: 4px 0; font-size: 0.85rem; line-height: 1.5; border: 1px solid #3a562a; box-shadow: inset 0 0 18px rgba(0,0,0,0.6); color: #dcd8b8; }
        .msg { padding: 4px 0; border-bottom: 1px dotted #3a4e2a; }
        .goal { color: #ffd966; font-weight: bold; text-shadow: 0 0 8px #c99d20; }
        .miss { color: #9a9a7a; }
        .crit { color: #ff8844; font-weight: bold; }
        .info { color: #b8cfb0; }
        .phase { color: #fff; background: #2b3f1e; border-radius: 20px; padding: 3px 12px; display: inline-block; margin: 4px 0; font-weight: bold; }
        #controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px 0; }
        .dice-area { display: flex; justify-content: center; gap: 20px; margin: 8px 0; }
        .dice-box { font-size: 2.2rem; font-weight: bold; color: #f5e56c; text-align: center; padding: 8px; min-width: 60px; background: #0a130a; border-radius: 12px; letter-spacing: 2px; }
        .dice-box.highlight { background: #5a4a1a; color: #ffd966; box-shadow: 0 0 16px #ff9900; border: 2px solid #ffcc00; }
        .vs-display { display: flex; justify-content: space-around; font-weight: bold; background: #1e2e1e; border-radius: 10px; padding: 8px; margin: 6px 0; }
        @keyframes flash { 0%,100%{ opacity:1; } 50%{ opacity:0.3; background:#ffd966; color:#000; } }
        .talent-flash { animation: flash 0.6s ease 3; }
        @keyframes fadeIn { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn 0.25s ease; }
        .goal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: bold; z-index: 100; pointer-events: none; text-shadow: 0 0 20px black; }
        .life-loss { animation: flashRed 0.5s ease 2; }
        @keyframes flashRed { 0%,100%{ color:#ff4444; } 50%{ color:#ffffff; } }

        .result-card { background: rgba(0,0,0,0.8); border: 2px solid #f7e05e; border-radius: 16px; padding: 20px; text-align: center; width: 80%; margin-bottom: 20px; }
        .result-score { font-size: 3rem; font-weight: bold; color: #fff; margin: 10px 0; }
        .result-label { color: #c0b87a; font-size: 1.2rem; }

        .progress-item, .shop-item {
            background: rgba(46, 90, 30, 0.8); border: 1px solid #6b8c42;
            border-radius: 12px; padding: 12px; margin: 8px 0; width: 90%;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .progress-item:active, .shop-item:active { transform: scale(0.98); }
        .item-left { flex: 1; min-width: 0; }
        .item-name { color: #fff; font-weight: bold; }
        .item-desc { color: #c0b87a; font-size: 0.75rem; word-break: break-word; }
        .item-price { color: #f7e05e; font-weight: bold; white-space: nowrap; }
        .alloc-row { display: flex; justify-content: space-between; width: 80%; margin: 10px 0; align-items: center; }
        .alloc-label { color: #f7e05e; font-weight: bold; font-size: 1.1rem; }
        .alloc-val { color: #fff; font-weight: bold; min-width: 20px; text-align: center; }
        .points-left { color: #fff; margin-bottom: 20px; font-size: 1.1rem; }

        .talent-panel { background: rgba(10,25,10,0.95); border-radius: 16px; padding: 20px; width: 80%; max-height: 60%; overflow-y: auto; }
        .talent-entry { margin: 8px 0; color: #f5e7b3; }
        .talent-entry .talent-name { font-weight: bold; color: #ffd966; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="cover-panel" class="fullscreen-panel">
        <div class="title">⚽ 冠军骰子</div>
        <div class="subtitle">巨星之路 · 文字足球肉鸽</div>
        <input type="text" id="player-name-input" class="input-name" placeholder="输入你的名字" maxlength="12">
        <button class="btn" id="btn-start-game">⚡ 开始生涯</button>
    </div>
    <div id="alloc-panel" class="fullscreen-panel hidden-panel">
        <div style="font-size:1.8rem; color:#f7e05e; margin-bottom:15px;">⚖️ 分配属性</div>
        <div class="points-left">剩余点数: <span id="points-remaining">3</span></div>
        <div class="alloc-row">
            <span class="alloc-label">⚔️ 进攻</span>
            <button class="btn" id="atk-minus">-</button>
            <span id="atk-alloc" class="alloc-val">5</span>
            <button class="btn" id="atk-plus">+</button>
        </div>
        <div class="alloc-row">
            <span class="alloc-label">🛡️ 防守</span>
            <button class="btn" id="def-minus">-</button>
            <span id="def-alloc" class="alloc-val">5</span>
            <button class="btn" id="def-plus">+</button>
        </div>
        <button class="btn" id="btn-confirm-alloc" style="margin-top:25px;">✅ 确认</button>
    </div>
    <div id="skill-select-panel" class="fullscreen-panel hidden-panel">
        <div style="font-size:1.8rem; color:#f7e05e; margin-bottom:15px;">✨ 选择初始技能</div>
        <div id="skill-options" style="width:90%;"></div>
    </div>
    <div id="talent-view-panel" class="fullscreen-panel hidden-panel">
        <div style="font-size:1.8rem; color:#f7e05e; margin-bottom:15px;">⭐ 我的天赋</div>
        <div id="talent-list" style="width:80%; text-align: center;"></div>
        <button class="btn" id="btn-close-talents" style="margin-top:20px;">关闭</button>
    </div>
    <div id="header">
        <div class="header-item">⚔️进攻 <span id="atk-val">5</span></div>
        <div class="header-item">🛡️防守 <span id="def-val">5</span></div>
        <div class="header-item">💪体能 <span id="stam-val">20/20</span></div>
        <div class="header-item">📈士气 <span id="morale-val">0</span></div>
        <button id="btn-view-talents" class="btn">⭐天赋</button>
    </div>
    <div id="progress-bar">
        <span>🏆<span id="league-phase-display">乙级</span></span>
        <div id="progress-dots" style="display:flex; gap:6px; align-items:center;"></div>
        <span>📅<span id="match-count-display">0/10</span></span>
        <span>❤️<span id="lives-display">3</span></span>
        <span>⚡<span id="exp-display">50</span></span>
    </div>
    <div id="output-area"></div>
    <div id="controls"></div>
</div>

<script>
(function() {
    const TALENTS = [
        { id: 'fox', name: '禁区之狐', desc: '射门时进攻+2', price: 80 },
        { id: 'counter', name: '反击号角', desc: '防守成功士气额外+1', price: 70 },
        { id: 'iron', name: '钢铁意志', desc: '士气不会低于0', price: 60 },
        { id: 'clutch', name: '绝杀血脉', desc: '比赛最后2回合优势', price: 90 },
        { id: 'lung', name: '铁肺', desc: '体能上限+5', price: 75 },
        { id: 'passing', name: '精准长传', desc: '突破检定时进攻+2', price: 70 },
        { id: 'wall', name: '叹息之墙', desc: '防守回合防守+1', price: 65 },
        { id: 'poacher', name: '抢点专家', desc: '突破成功后射门优势', price: 85 }
    ];
    const SKILLS = [
        { id: 'cannon', name: '重炮轰门', cost: 5, desc: '射门优势(双骰取高)', target:'shot', effect:'advantage', price: 90 },
        { id: 'wallSkill', name: '铜墙铁壁', cost: 4, desc: '防守回合防守+4', target:'defend', effect:'defUp4', price: 80 },
        { id: 'offside', name: '反越位', cost: 6, desc: '突破自动成功', target:'break', effect:'autoSuccess', price: 100 },
        { id: 'cool', name: '冷静推射', cost: 3, desc: '射门时对方防守-2', target:'shot', effect:'reduceOppDef2', price: 70 },
        { id: 'ironDefend', name: '铁血防守', cost: 5, desc: '对方进攻时防守+4且优势', target:'defend', effect:'blockAdvantage', price: 85 },
        { id: 'dribble', name: '牛尾巴过人', cost: 4, desc: '突破时进攻+3', target:'break', effect:'atkUp3', price: 75 }
    ];
    const CONSUMABLES = [
        { id: 'drink', name: '运动饮料', desc: '恢复10体能', type:'active', price: 30 },
        { id: 'spray', name: '战前动员', desc: '比赛开局士气+2', type:'passive', price: 40 },
        { id: 'charm', name: '幸运符', desc: '大失败时自动重掷', type:'passive', price: 50 }
    ];

    const PROGRESS_POOL = [
        { type: 'attr', name: '进攻训练', desc: '进攻+1', val: 'atk' },
        { type: 'attr', name: '防守演练', desc: '防守+1', val: 'def' },
        { type: 'attr', name: '体能特训', desc: '体能上限+2', val: 'stam' },
        { type: 'item', name: '补给品箱', desc: '随机获得1个消耗品', val: 'random_item' },
        { type: 'exp', name: '战术复盘', desc: '获得30经验', val: 30 }
    ];

    class Player {
        constructor(name) {
            this.name = name || '传奇';
            this.attack = 5; this.defense = 5;
            this.maxStamina = 20; this.stamina = 20;
            this.morale = 0;
            this.talents = []; this.skills = []; this.consumables = [];
            this.exp = 50; this.lives = 3;
            this.currentLeague = 0; this.matchesPlayed = 0;
            this.totalWins = 0; this.totalLosses = 0;
            this.championsLeagueWon = false;
            this.match = null;
            this.leagueProgressSlots = []; // 联赛进度槽位
            this.currentShopItems = []; // 商店商品列表
        }
        get staminaBonus() { return this.talents.some(t=>t.id==='lung') ? 5 : 0; }
        get effectiveMaxStamina() { return this.maxStamina + this.staminaBonus; }
        resetForMatch() {
            this.maxStamina = 20 + (this.talents.some(t=>t.id==='lung')?5:0);
            let startMorale = 0;
            this.consumables.forEach((c, idx) => {
                if(c.id === 'spray' && !this.match?.usedConsumables?.includes(idx)) {
                    startMorale += 2;
                }
            });
            this.stamina = this.effectiveMaxStamina;
            this.morale = startMorale;
            if(startMorale > 0) appendOutput(`🧪 战前动员生效：开局士气+${startMorale}`, 'info');
            this.match = { score:[0,0], currentTurn:0, maxTurns:10, firstAttack:null, turnOrder:[], lastBreakSuccess:false, moraleLocked:false, usedConsumables:[], opponent:null, attackSuccess:0, defendSuccess:0 };
        }
        adjustMorale(delta) {
            if (this.match?.moraleLocked && delta < 0) return;
            let old = this.morale;
            this.morale = Math.min(5, Math.max(-2, this.morale + delta));
            if (this.talents.some(t=>t.id==='iron') && this.morale < 0) this.morale = 0;
            if (this.morale !== old && this.match) {
                let emoji = delta > 0 ? '🔥' : '💧';
                if (this.morale >= 4) emoji = '😤';
                else if (this.morale <= -2) emoji = '💔';
                appendOutput(`士气 ${delta>0?'+'+delta:delta} → ${this.morale} ${emoji}`, 'info');
            }
            updateUI();
        }
    }

    let player;
    let gameState = 'cover';
    let allocPoints = 0, tempAtk = 5, tempDef = 5;
    let isAnimating = false;

    const coverPanel = document.getElementById('cover-panel');
    const allocPanel = document.getElementById('alloc-panel');
    const skillPanel = document.getElementById('skill-select-panel');
    const talentViewPanel = document.getElementById('talent-view-panel');
    const outputArea = document.getElementById('output-area');
    const controlsDiv = document.getElementById('controls');

    function updateUI() {
        document.getElementById('atk-val').textContent = player.attack;
        document.getElementById('def-val').textContent = player.defense;
        document.getElementById('stam-val').textContent = `${player.stamina}/${player.effectiveMaxStamina}`;
        document.getElementById('morale-val').textContent = player.morale;
        document.getElementById('league-phase-display').textContent = ['乙级','甲级','超级'][player.currentLeague];
        document.getElementById('match-count-display').textContent = `${player.matchesPlayed}/10`;
        document.getElementById('lives-display').textContent = player.lives;
        document.getElementById('exp-display').textContent = player.exp;
        updateProgressBar();
    }

    function updateProgressBar() {
        const dots = [];
        for (let i = 0; i < 10; i++) {
            const slot = player.leagueProgressSlots.find(s => s.index === i);
            const isPlayed = i < player.matchesPlayed;
            let className = 'progress-dot';
            if (slot && !slot.claimed) {
                // 未领取的槽位显示蓝色三角
                className += ' buff-slot';
                if (slot.index < player.matchesPlayed) {
                    // 已经过了该场但还没领取 (正常情况下不会，但以防万一)
                }
            } else if (slot && slot.claimed) {
                // 已领取的显示灰色三角
                className += ' buff-slot claimed';
            } else if (isPlayed) {
                className += ' active'; // 普通已打场次
            }
            dots.push(`<span class="${className}"></span>`);
        }
        document.getElementById('progress-dots').innerHTML = dots.join('');
    }

    function clearOutput() { outputArea.innerHTML = ''; }
    function appendOutput(text, cls='') {
        const div = document.createElement('div');
        div.className = `msg ${cls} fade-in`;
        div.innerHTML = text;
        outputArea.appendChild(div);
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function setControls(buttons) {
        controlsDiv.innerHTML = '';
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.textContent = b.text; btn.className = 'btn';
            if (b.disabled || isAnimating) btn.disabled = true;
            btn.addEventListener('click', (e) => {
                if (isAnimating) { e.preventDefault(); return; }
                b.action();
            });
            controlsDiv.appendChild(btn);
        });
    }

    function disableAllButtons() {
        document.querySelectorAll('#controls .btn').forEach(btn => btn.disabled = true);
    }

    function showGoalAnimation(isPlayer) {
        const overlay = document.createElement('div');
        overlay.className = 'goal-overlay';
        overlay.textContent = isPlayer ? '⚽ 进球！！！' : '💔 丢球...';
        if (isPlayer) {
            overlay.style.background = 'rgba(255,215,0,0.5)';
            overlay.style.color = '#ffd700';
        } else {
            overlay.style.background = 'rgba(255,0,0,0.4)';
            overlay.style.color = '#ff4444';
        }
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 800);
    }

    function showLifeLossAnimation() {
        const livesSpan = document.getElementById('lives-display');
        livesSpan.classList.add('life-loss');
        setTimeout(() => livesSpan.classList.remove('life-loss'), 1000);
    }

    async function rollD20Quick(label, advantage = false) {
        isAnimating = true;
        disableAllButtons();
        let finalVal = 0;
        let isReroll = false;
        const doRoll = async () => {
            let r1 = Math.floor(Math.random()*20)+1;
            let r2 = Math.floor(Math.random()*20)+1;
            let val = r1;
            if (advantage) {
                appendOutput(`✨ 优势触发！双骰取高：`, 'info');
                const diceArea = document.createElement('div');
                diceArea.className = 'dice-area fade-in';
                outputArea.appendChild(diceArea);
                const box1 = document.createElement('div'); box1.className = 'dice-box'; box1.textContent = '🎲?';
                const box2 = document.createElement('div'); box2.className = 'dice-box'; box2.textContent = '🎲?';
                diceArea.appendChild(box1); diceArea.appendChild(box2);
                outputArea.scrollTop = outputArea.scrollHeight;
                let step = 0, maxSteps = 8;
                await new Promise(resolve => {
                    const doStep = () => {
                        box1.textContent = `🎲${Math.floor(Math.random()*20)+1}`;
                        box2.textContent = `🎲${Math.floor(Math.random()*20)+1}`;
                        step++;
                        if (step >= maxSteps) setTimeout(resolve, 200);
                        else setTimeout(doStep, 50 + step * 30);
                    };
                    doStep();
                });
                box1.textContent = `🎲${r1}`; box2.textContent = `🎲${r2}`;
                val = Math.max(r1, r2);
                if (r1 >= r2) box1.classList.add('highlight'); else box2.classList.add('highlight');
                await new Promise(r => setTimeout(r, 400));
                appendOutput(`取高值：${label} = ${val}`, 'info');
            } else {
                const diceBox = document.createElement('div');
                diceBox.className = 'dice-box';
                outputArea.appendChild(diceBox);
                outputArea.scrollTop = outputArea.scrollHeight;
                let step = 0, maxSteps = 6;
                await new Promise(resolve => {
                    const doStep = () => {
                        diceBox.textContent = `🎲${Math.floor(Math.random()*20)+1}`;
                        step++;
                        if (step >= maxSteps) setTimeout(resolve, 100);
                        else setTimeout(doStep, 50 + step * 30);
                    };
                    doStep();
                });
                diceBox.textContent = `🎲${val}`;
                appendOutput(`${label} 掷出 ${val}`);
            }
            return val;
        };
        finalVal = await doRoll();
        if (finalVal === 1 && !isReroll) {
            const charmIndex = player.consumables.findIndex(c => c.id === 'charm');
            if (charmIndex !== -1) {
                player.consumables.splice(charmIndex, 1);
                appendOutput(`🍀 幸运符触发！抵消大失败，重掷！`, 'crit');
                isReroll = true;
                finalVal = await doRoll();
            }
        }
        if (finalVal === 20) appendOutput(`${label} 🌟大成功！`, 'crit');
        else if (finalVal === 1) appendOutput(`${label} 💥大失败！`, 'crit');
        isAnimating = false;
        return finalVal;
    }

    function getOpponentStats() {
        const league = player.currentLeague;
        let minAtk, maxAtk, minDef, maxDef;
        if (league === 0) { minAtk=3; maxAtk=5; minDef=4; maxDef=6; }
        else if (league === 1) { minAtk=5; maxAtk=8; minDef=8; maxDef=10; }
        else { minAtk=10; maxAtk=15; minDef=12; maxDef=18; }
        return {
            attack: Math.floor(Math.random()*(maxAtk-minAtk+1))+minAtk,
            defense: Math.floor(Math.random()*(maxDef-minDef+1))+minDef
        };
    }
    function getCLOpponentStats() {
        return {
            attack: Math.floor(Math.random()*5)+16,
            defense: Math.floor(Math.random()*5)+14
        };
    }

    function applyPassives(phase, base, log = true) {
        let v = base;
        const triggered = [];
        if (phase === 'break' && player.talents.some(t => t.id === 'passing')) {
            v += 2;
            triggered.push('精准长传');
        }
        if (phase === 'defend' && player.talents.some(t => t.id === 'wall')) {
            v += 1;
            triggered.push('叹息之墙');
        }
        if (phase === 'shot' && player.talents.some(t => t.id === 'fox')) {
            v += 2;
            triggered.push('禁区之狐');
        }
        if (log) {
            triggered.forEach(talentName => {
                appendOutput(`⭐ 天赋【${talentName}】发动！`, 'info');
            });
        }
        return v;
    }

    function checkClutch() { return player.talents.some(t => t.id === 'clutch') && player.match && player.match.currentTurn >= 8; }

    function showVs(left, right) {
        const div = document.createElement('div');
        div.className = 'vs-display fade-in';
        div.innerHTML = `<span>${left}</span> VS <span>${right}</span>`;
        outputArea.appendChild(div);
    }

    // 联赛开始时生成进度槽位
    function generateLeagueSlots() {
        const slots = [];
        const count = Math.floor(Math.random() * 2) + 2; // 2~3个
        const candidates = [];
        // 收集所有可能的索引（1~8）
        for (let i = 1; i <= 8; i++) candidates.push(i);
        // 随机打乱
        for (let i = candidates.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        // 选取不相邻的位置
        const selected = [];
        for (const idx of candidates) {
            if (selected.length === count) break;
            if (!selected.some(s => Math.abs(s - idx) <= 1)) {
                selected.push(idx);
            }
        }
        // 生成槽位数据
        selected.forEach(idx => {
            const randomItem = PROGRESS_POOL[Math.floor(Math.random() * PROGRESS_POOL.length)];
            slots.push({ index: idx, item: randomItem, claimed: false });
        });
        player.leagueProgressSlots = slots;
        updateProgressBar();
    }

    async function startMatch() {
        player.resetForMatch();
        updateUI();
        let opp = (gameState === 'champions_league') ? getCLOpponentStats() : getOpponentStats();
        player.match.opponent = opp;
        let roll = Math.floor(Math.random()*20)+1;
        player.match.firstAttack = roll > 10 ? 'player' : 'opponent';
        let order = [];
        for (let i=0; i<10; i++) order.push(i%2===0 ? player.match.firstAttack : (player.match.firstAttack==='player'?'opponent':'player'));
        player.match.turnOrder = order;
        clearOutput();
        appendOutput(`📢 对手 攻${opp.attack} 防${opp.defense}`, 'phase');
        appendOutput(`先攻 ${player.match.firstAttack==='player'?'你':'对手'}`);
        await processTurn();
    }

    async function processTurn() {
        if (!player.match || player.match.currentTurn >= 10) { await endMatch(); return; }
        let attacker = player.match.turnOrder[player.match.currentTurn];
        if (attacker === 'player') await playerTurn();
        else await opponentTurn();
    }

    async function playerTurn() {
        updateUI(); clearOutput();
        appendOutput(`⚡ 第${player.match.currentTurn+1}回合：你的进攻`, 'phase');
        appendOutput(`比分 ${player.match.score[0]}:${player.match.score[1]} 士气${player.morale} 体能${player.stamina}`);
        let buttons = [{ text: '🏃 突破', action: async () => { await playerBreak(); } }];
        player.skills.forEach(s => {
            if ((s.target==='break'||s.target==='any') && player.stamina>=s.cost)
                buttons.push({ text: `✨ ${s.name}(${s.cost})`, action: async () => { await useSkill(s); } });
        });
        player.consumables.forEach((c,i) => {
            if(c.type !== 'passive' && !player.match.usedConsumables.includes(i))
                buttons.push({ text: `🧪 ${c.name}`, action: async () => { await useConsumable(i); } });
        });
        setControls(buttons);
    }

    async function playerBreak(skillEffect = null) {
        if (skillEffect === 'autoSuccess') {
            appendOutput('💫 反越位成功！直面门将！', 'crit');
            player.match.lastBreakSuccess = true;
            await showShotOptions(); return;
        }
        let adv = checkClutch();
        if (adv) appendOutput('🔥 绝杀血脉发动！', 'info');
        let roll = await rollD20Quick('你', adv);
        if (roll === 20) {
            player.adjustMorale(1);
            appendOutput('🌟 完美突破！', 'goal');
            player.match.lastBreakSuccess = true;
            await showShotOptions(); return;
        } else if (roll === 1) {
            player.adjustMorale(-1);
            appendOutput('💥 突破失误...', 'miss');
            player.match.lastBreakSuccess = false; showContinueButton(); return;
        }
        let breakBonus = applyPassives('break', player.attack);
        if(skillEffect === 'atkUp3') breakBonus += 3;
        let total = roll + breakBonus + player.morale;
        appendOutput(`对手防守...`);
        await new Promise(r => setTimeout(r, 500));
        let oppRoll = await rollD20Quick('对手');
        if (oppRoll === 20) {
            player.adjustMorale(-1);
            appendOutput('🌟 对手完美防守！', 'miss');
            player.match.lastBreakSuccess = false; showContinueButton(); return;
        } else if (oppRoll === 1) {
            player.adjustMorale(1);
            appendOutput('💥 对手失误！突破！', 'goal');
            player.match.lastBreakSuccess = true;
            await showShotOptions(); return;
        }
        let oppTotal = oppRoll + player.match.opponent.defense;
        showVs(`${total} (突破)`, `${oppTotal} (防守)`);
        if (total > oppTotal) {
            appendOutput('✅ 突破成功！', 'goal');
            player.match.lastBreakSuccess = true;
            await showShotOptions();
        } else {
            appendOutput('❌ 被抢断。', 'miss');
            player.match.lastBreakSuccess = false; showContinueButton();
        }
    }

    async function showShotOptions() {
        let buttons = [{ text: '🥅 射门', action: async () => { await playerShot(); } }];
        player.skills.forEach(s => {
            if ((s.target==='shot'||s.target==='any') && player.stamina>=s.cost)
                buttons.push({ text: `✨ ${s.name}(${s.cost})`, action: async () => { await useSkillOnShot(s); } });
        });
        setControls(buttons);
    }

    async function playerShot(skillEffect = null) {
        let adv = checkClutch() || (player.talents.some(t=>t.id==='poacher') && player.match.lastBreakSuccess);
        if (adv && player.talents.some(t=>t.id==='poacher') && player.match.lastBreakSuccess) {
            appendOutput('⚡ 抢点专家发动！', 'info');
        }
        if (skillEffect === 'advantage') adv = true;
        let roll = await rollD20Quick('你', adv);
        if (roll === 20) {
            player.adjustMorale(2);
            appendOutput('🌟 世界波！', 'goal');
            showGoalAnimation(true);
            player.match.score[0]++; showContinueButton(); return;
        } else if (roll === 1) {
            player.adjustMorale(-1);
            appendOutput('💥 打飞了...', 'miss');
            showContinueButton(); return;
        }
        let shotBonus = applyPassives('shot', player.attack);
        let total = roll + shotBonus + player.morale;
        appendOutput(`门将扑救...`);
        await new Promise(r => setTimeout(r, 500));
        let oppRoll = await rollD20Quick('门将');
        if (oppRoll === 20) {
            player.adjustMorale(-1);
            appendOutput('🌟 神扑！', 'miss');
            showContinueButton(); return;
        } else if (oppRoll === 1) {
            player.adjustMorale(2);
            appendOutput('💥 门将失误！进球！', 'goal');
            showGoalAnimation(true);
            player.match.score[0]++; showContinueButton(); return;
        }
        let oppDef = player.match.opponent.defense;
        if (skillEffect === 'reduceOppDef2') oppDef -= 2;
        let oppTotal = oppRoll + oppDef;
        showVs(`${total} (射门)`, `${oppTotal} (扑救)`);
        if (total > oppTotal) {
            appendOutput('⚽🥅 进球了！', 'goal');
            showGoalAnimation(true);
            player.match.score[0]++; player.adjustMorale(2);
        } else {
            appendOutput('😞 被扑出。', 'miss');
        }
        showContinueButton();
    }

    async function opponentTurn() {
        clearOutput();
        appendOutput(`🛡️ 第${player.match.currentTurn+1}回合：对手进攻`, 'phase');
        appendOutput(`比分 ${player.match.score[0]}:${player.match.score[1]} 士气${player.morale} 体能${player.stamina}`);
        let buttons = [{ text: '🛡️ 防守', action: async () => { await opponentAttack(); } }];
        player.skills.forEach(s => {
            if ((s.target==='defend'||s.target==='defendShot'||s.target==='any') && player.stamina>=s.cost)
                buttons.push({ text: `✨ ${s.name}(${s.cost})`, action: async () => { await useSkillOnDefense(s); } });
        });
        setControls(buttons);
    }

    async function opponentAttack(skill = null) {
        let adv = checkClutch();
        if (adv) appendOutput('🔥 绝杀血脉发动！', 'info');
        let defBonus = applyPassives('defend', player.defense);
        if (skill?.effect==='defUp4' || skill?.effect==='blockAdvantage') defBonus+=4;
        if (skill?.effect==='blockAdvantage') adv=true;
        let roll = await rollD20Quick('对手');
        if (roll === 20) {
            player.adjustMorale(-1);
            appendOutput('🌟 对手犀利突破！', 'miss');
            await oppShot(); return;
        } else if (roll === 1) {
            player.adjustMorale(1);
            appendOutput('💥 对手失误！断球！', 'goal');
            if (player.talents.some(t => t.id === 'counter')) {
                player.adjustMorale(1);
                appendOutput('📯 反击号角：士气额外+1', 'info');
            }
            showContinueButton(); return;
        }
        let oppTotal = roll + player.match.opponent.attack;
        appendOutput(`你防守...`);
        await new Promise(r => setTimeout(r, 500));
        let defRoll = await rollD20Quick('你', adv);
        if (defRoll === 20) {
            player.adjustMorale(1);
            appendOutput('🌟 完美防守！', 'goal');
            if (player.talents.some(t => t.id === 'counter')) {
                player.adjustMorale(1);
                appendOutput('📯 反击号角：士气额外+1', 'info');
            }
            showContinueButton(); return;
        } else if (defRoll === 1) {
            player.adjustMorale(-1);
            appendOutput('💥 防守失误！', 'miss');
            await oppShot(); return;
        }
        let defTotal = defRoll + defBonus + player.morale;
        showVs(`${oppTotal} (对手)`, `${defTotal} (防守)`);
        if (defTotal > oppTotal) {
            appendOutput('💪 断球成功！', 'goal');
            if (player.talents.some(t => t.id === 'counter')) {
                player.adjustMorale(1);
                appendOutput('📯 反击号角：士气额外+1', 'info');
            }
            showContinueButton();
        } else {
            appendOutput('⚠️ 对手突破！', 'miss');
            await oppShot();
        }
    }

    async function oppShot() {
        let roll = await rollD20Quick('对手');
        if (roll === 20) {
            player.adjustMorale(-2);
            appendOutput('🌟 绝对死角...', 'miss');
            showGoalAnimation(false);
            player.match.score[1]++; showContinueButton(); return;
        } else if (roll === 1) {
            player.adjustMorale(1);
            appendOutput('💥 打偏了！', 'info');
            showContinueButton(); return;
        }
        let oppTotal = roll + player.match.opponent.attack;
        appendOutput(`你扑救...`);
        await new Promise(r => setTimeout(r, 500));
        let defRoll = await rollD20Quick('你');
        if (defRoll === 20) {
            player.adjustMorale(1);
            appendOutput('🌟 神扑！', 'info');
            showContinueButton(); return;
        } else if (defRoll === 1) {
            player.adjustMorale(-1);
            appendOutput('💥 扑救失误...', 'miss');
            showGoalAnimation(false);
            player.match.score[1]++; showContinueButton(); return;
        }
        let defTotal = defRoll + applyPassives('defend', player.defense, false) + player.morale;
        showVs(`${oppTotal} (射门)`, `${defTotal} (扑救)`);
        if (defTotal > oppTotal) {
            appendOutput('🧤 扑救成功！', 'info');
        } else {
            appendOutput('💔 球进了...', 'miss');
            showGoalAnimation(false);
            player.match.score[1]++; player.adjustMorale(-1);
        }
        showContinueButton();
    }

    function showContinueButton() {
        player.match.currentTurn++;
        setControls([{ text: '➡️ 继续', action: async () => { await processTurn(); } }]);
    }

    // 生成商店商品列表
    function generateShopItems() {
        const items = [];
        const availableTalents = TALENTS.filter(t => !player.talents.some(pt => pt.id === t.id));
        const shuffledTalents = [...availableTalents].sort(() => 0.5 - Math.random()).slice(0, 2);
        shuffledTalents.forEach(t => items.push({ type: 'talent', data: t, price: t.price }));

        const availableSkills = SKILLS.filter(s => !player.skills.some(ps => ps.id === s.id));
        const shuffledSkills = [...availableSkills].sort(() => 0.5 - Math.random()).slice(0, 2);
        shuffledSkills.forEach(s => items.push({ type: 'skill', data: s, price: s.price }));

        const shuffledConsumables = [...CONSUMABLES].sort(() => 0.5 - Math.random()).slice(0, 1);
        shuffledConsumables.forEach(c => items.push({ type: 'consumable', data: c, price: c.price }));
        return items;
    }

    function renderProgressAndShop() {
        clearOutput();
        appendOutput(`📈 进步与机会 · 经验:${player.exp}`, 'phase');

        // 显示当前可领取的槽位奖励
        const currentSlot = player.leagueProgressSlots.find(s => s.index === player.matchesPlayed && !s.claimed);
        if (currentSlot) {
            appendOutput('--- 可领取的进步 ---', 'info');
            const div = document.createElement('div');
            div.className = 'progress-item';
            div.innerHTML = `
                <div class="item-left">
                    <div class="item-name">🎁 ${currentSlot.item.name}</div>
                    <div class="item-desc">${currentSlot.item.desc}</div>
                </div>
                <div class="item-price">免费领取</div>
            `;
            div.style.cursor = 'pointer';
            div.onclick = () => {
                claimSlotReward(currentSlot);
            };
            outputArea.appendChild(div);
        }

        // 商店部分
        appendOutput('--- 商店 ---', 'info');
        if (player.currentShopItems.length === 0) {
            appendOutput('商品已售罄，点击刷新补充。', 'miss');
        }
        player.currentShopItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            let icon = item.type === 'talent' ? '⭐' : (item.type === 'skill' ? '✨' : '🧪');
            div.innerHTML = `
                <div class="item-left">
                    <div class="item-name">${icon} ${item.data.name}</div>
                    <div class="item-desc">${item.data.desc || ''}</div>
                </div>
                <div class="item-price">${item.price} EXP</div>
            `;
            div.style.cursor = 'pointer';
            div.onclick = () => {
                if (player.exp >= item.price) {
                    player.exp -= item.price;
                    if (item.type === 'talent') player.talents.push(item.data);
                    else if (item.type === 'skill') player.skills.push(item.data);
                    else if (item.type === 'consumable') player.consumables.push(item.data);
                    appendOutput(`✅ 购买了 ${item.data.name}！`, 'goal');
                    player.currentShopItems.splice(index, 1);
                    updateUI();
                    renderProgressAndShop();
                } else {
                    appendOutput('经验不足！', 'miss');
                }
            };
            outputArea.appendChild(div);
        });

        const refreshCost = 20;
        const buttons = [];
        buttons.push({ text: `🔄 刷新商品 (${refreshCost}EXP)`, action: () => {
            if (player.exp >= refreshCost) {
                player.exp -= refreshCost;
                player.currentShopItems = generateShopItems();
                appendOutput('商品已刷新！', 'info');
                updateUI();
                renderProgressAndShop();
            } else {
                appendOutput('经验不足，无法刷新！', 'miss');
            }
        }});
        buttons.push({ text: '⚽ 下一场比赛', action: async () => { await startMatch(); } });
        setControls(buttons);
    }

    function claimSlotReward(slot) {
        slot.claimed = true;
        const item = slot.item;
        appendOutput(`领取了：${item.name}`, 'goal');
        if (item.type === 'attr') {
            if (item.val === 'atk') { player.attack++; appendOutput('进攻 +1', 'info'); }
            if (item.val === 'def') { player.defense++; appendOutput('防守 +1', 'info'); }
            if (item.val === 'stam') { player.maxStamina += 2; appendOutput('体能上限 +2', 'info'); }
        } else if (item.type === 'item') {
            const randomC = CONSUMABLES[Math.floor(Math.random() * CONSUMABLES.length)];
            player.consumables.push(randomC);
            appendOutput(`获得消耗品：${randomC.name}`, 'info');
        } else if (item.type === 'exp') {
            player.exp += item.val;
            appendOutput(`经验 +${item.val}`, 'info');
        }
        updateProgressBar();
        updateUI();
        renderProgressAndShop(); // 刷新界面
    }

    function showProgressAndShop() {
        player.currentShopItems = generateShopItems();
        renderProgressAndShop();
    }

    // 天赋查看
    document.getElementById('btn-view-talents').addEventListener('click', () => {
        talentViewPanel.classList.remove('hidden-panel');
        const listDiv = document.getElementById('talent-list');
        if (player.talents.length === 0) {
            listDiv.innerHTML = '<div style="color:#c0b87a;">暂无天赋</div>';
        } else {
            listDiv.innerHTML = player.talents.map(t =>
                `<div class="talent-entry"><span class="talent-name">⭐ ${t.name}</span><br><span style="font-size:0.8rem; color:#ccc;">${t.desc}</span></div>`
            ).join('');
        }
    });
    document.getElementById('btn-close-talents').addEventListener('click', () => {
        talentViewPanel.classList.add('hidden-panel');
    });

    async function endMatch() {
        updateUI();
        let win = player.match.score[0] > player.match.score[1];
        let draw = player.match.score[0] === player.match.score[1];

        const overlay = document.createElement('div');
        overlay.className = 'fullscreen-panel';
        overlay.style.zIndex = '50';
        let resultText = win ? '🏆 胜利' : (draw ? '🤝 平局' : '💔 失败');
        let resultColor = win ? '#ffd966' : (draw ? '#fff' : '#ff4444');
        let expGain = win ? 30 : (draw ? 20 : 10);

        overlay.innerHTML = `
            <div class="result-card">
                <div class="result-label" style="color:${resultColor}">${resultText}</div>
                <div class="result-score">${player.match.score[0]} - ${player.match.score[1]}</div>
                <div style="margin-top:10px; font-size:0.9rem; color:#ccc;">
                    ${win ? '获得 30 经验' : (draw ? '获得 20 经验' : '获得 10 经验，生命 -1')}
                </div>
            </div>
            <button class="btn" id="btn-end-match-continue" style="text-align:center; width:60%;">继续</button>
        `;
        document.body.appendChild(overlay);

        player.exp += expGain;
        if (win) player.totalWins++;
        else if (draw) { /* 平局不计胜场 */ }
        else {
            player.totalLosses++;
            player.lives--;
            showLifeLossAnimation();
        }
        player.matchesPlayed++;
        updateUI();

        document.getElementById('btn-end-match-continue').onclick = () => {
            overlay.remove();
            if (player.lives <= 0) {
                appendOutput('💀 你的生涯结束了...', 'crit');
                setControls([{ text: '🔄 重新开始', action: () => location.reload() }]);
            } else {
                if (player.matchesPlayed >= 10) {
                    handleLeagueProgress();
                } else {
                    showProgressAndShop(); // 进入进步与机会面板
                }
            }
        };
    }

    function handleLeagueProgress() {
        if (player.totalWins >= 6) {
            if (player.currentLeague < 2) {
                player.currentLeague++;
                player.matchesPlayed = 0;
                player.totalWins = 0;
                player.totalLosses = 0;
                player.exp += 50;
                generateLeagueSlots(); // 新联赛重新生成槽位
                appendOutput(`🎉 晋级！进入 ${['乙级','甲级','超级'][player.currentLeague]}`, 'goal');
                showProgressAndShop();
            } else {
                if (!player.championsLeagueWon) {
                    player.championsLeagueWon = true;
                    player.matchesPlayed = 0;
                    player.totalWins = 0;
                    player.totalLosses = 0;
                    generateLeagueSlots(); // 欧冠也重新生成
                    appendOutput(`🏆 冠军！获得欧冠资格！`, 'goal');
                    gameState = 'champions_league';
                    showProgressAndShop();
                } else {
                    appendOutput(`🌟 你已经成为了传奇！`, 'goal');
                    setControls([{ text: '🔄 重新开始', action: () => location.reload() }]);
                    return;
                }
            }
        } else {
            appendOutput(`😢 胜场不足，降级或维持...`, 'miss');
            if (player.currentLeague > 0 && player.totalWins < 4) player.currentLeague--;
            player.matchesPlayed = 0;
            player.totalWins = 0;
            player.totalLosses = 0;
            generateLeagueSlots(); // 新联赛重新生成槽位
            showProgressAndShop();
        }
        updateUI();
    }

    async function useSkill(skill) {
        if (player.stamina < skill.cost) return;
        player.stamina -= skill.cost;
        updateUI();
        appendOutput(`使用了 ${skill.name}!`, 'info');
        if (skill.target === 'break') await playerBreak(skill.effect);
        else await playerBreak(skill.effect);
    }

    async function useSkillOnShot(skill) {
        if (player.stamina < skill.cost) return;
        player.stamina -= skill.cost;
        updateUI();
        appendOutput(`使用了 ${skill.name}!`, 'info');
        await playerShot(skill.effect);
    }

    async function useSkillOnDefense(skill) {
        if (player.stamina < skill.cost) return;
        player.stamina -= skill.cost;
        updateUI();
        appendOutput(`使用了 ${skill.name}!`, 'info');
        await opponentAttack(skill);
    }

    async function useConsumable(index) {
        let c = player.consumables[index];
        player.match.usedConsumables.push(index);
        appendOutput(`使用了 ${c.name}`, 'info');
        if (c.id === 'drink') {
            player.stamina = Math.min(player.stamina + 10, player.effectiveMaxStamina);
        }
        updateUI();
        if (player.match.turnOrder[player.match.currentTurn] === 'player') await playerTurn();
        else await opponentTurn();
    }

    // 初始化
    document.getElementById('btn-start-game').addEventListener('click', () => {
        const name = document.getElementById('player-name-input').value;
        player = new Player(name);
        coverPanel.classList.add('hidden-panel');
        tempAtk = 5; tempDef = 5; allocPoints = 3;
        updateAllocUI();
        allocPanel.classList.remove('hidden-panel');
    });

    function updateAllocUI() {
        document.getElementById('points-remaining').textContent = allocPoints;
        document.getElementById('atk-alloc').textContent = tempAtk;
        document.getElementById('def-alloc').textContent = tempDef;
        document.getElementById('atk-plus').disabled = allocPoints <= 0;
        document.getElementById('atk-minus').disabled = tempAtk <= 5;
        document.getElementById('def-plus').disabled = allocPoints <= 0;
        document.getElementById('def-minus').disabled = tempDef <= 5;
        document.getElementById('btn-confirm-alloc').disabled = allocPoints > 0;
    }

    document.getElementById('atk-plus').addEventListener('click', () => { if(allocPoints>0){ tempAtk++; allocPoints--; updateAllocUI(); }});
    document.getElementById('atk-minus').addEventListener('click', () => { if(tempAtk>5){ tempAtk--; allocPoints++; updateAllocUI(); }});
    document.getElementById('def-plus').addEventListener('click', () => { if(allocPoints>0){ tempDef++; allocPoints--; updateAllocUI(); }});
    document.getElementById('def-minus').addEventListener('click', () => { if(tempDef>5){ tempDef--; allocPoints++; updateAllocUI(); }});

    document.getElementById('btn-confirm-alloc').addEventListener('click', () => {
        player.attack = tempAtk;
        player.defense = tempDef;
        allocPanel.classList.add('hidden-panel');
        generateLeagueSlots(); // 初始联赛生成槽位
        showSkillSelect();
    });

    function showSkillSelect() {
        skillPanel.classList.remove('hidden-panel');
        const container = document.getElementById('skill-options');
        container.innerHTML = '';
        const shuffled = [...SKILLS].sort(() => 0.5 - Math.random()).slice(0, 3);
        shuffled.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.width = '100%';
            btn.style.marginBottom = '10px';
            btn.style.textAlign = 'center';
            btn.innerHTML = `<div>✨ ${s.name} (消耗:${s.cost})</div><div style="font-size:0.75rem; color:#c0b87a">${s.desc}</div>`;
            btn.onclick = () => {
                player.skills.push(s);
                skillPanel.classList.add('hidden-panel');
                gameState = 'playing';
                updateUI();
                startMatch();
            };
            container.appendChild(btn);
        });
    }
})();
</script>
</body>
</html>
