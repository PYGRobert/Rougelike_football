<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>冠军骰子 · 巨星之路</title>
    <style>
        :root {
            --bg: #1a3a1a;
            --panel-bg: #2e5a1a;
            --gold: #f7e05e;
            --gold-dark: #c9a227;
            --text-light: #f0e6b2;
            --text-mid: #d8d0a0;
            --border-green: #8bb84e;
            --btn-green: #4a8a2a;
            --btn-yellow: #b8930e;
            --btn-red: #a83232;
            --btn-blue: #2a5a8a;
            --dice-bg: #0a130a;
            --highlight-bg: #5a4a1a;
            --output-bg: rgba(5, 15, 5, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a3a1a;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 4px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(180deg, #2e5a1a 0%, #1a3e0e 100%);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            padding: 10px;
            display: flex;
            flex-direction: column;
            border: 3px solid #f5e56c;
            position: relative;
            overflow: hidden;
            min-height: 92vh;
            max-height: 98vh;
        }
        #game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #3a6a1e 0%, #2d5a1e 60%);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
        .fullscreen-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 22, 8, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            padding: 16px;
        }
        .hidden-panel {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }
        .title {
            font-size: 2.4rem;
            font-weight: 900;
            color: #f7e05e;
            text-shadow: 0 0 14px #c9a227;
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            color: #f0e6b2;
            font-size: 0.95rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-name {
            background: #1a2a1a;
            border: 2px solid #8bb84e;
            border-radius: 30px;
            padding: 12px;
            font-size: 1.2rem;
            color: #f7e05e;
            text-align: center;
            outline: none;
            width: 80%;
            margin-bottom: 18px;
            font-weight: bold;
        }
        .btn {
            border-radius: 26px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            margin: 5px;
            white-space: normal;
            word-break: break-word;
            max-width: 95%;
            text-align: center;
            line-height: 1.3;
            transition: 0.08s;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            border: 2px solid #6b8c42;
            background: linear-gradient(180deg, #5e8a30 0%, #3a5e1a 100%);
            box-shadow: 0 4px 0 #1a2e0e;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1a2e0e;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 4px 0 #1a2e0e;
            cursor: not-allowed;
        }
        .btn-confirm {
            background: linear-gradient(180deg, #4da826 0%, #2d6b12 100%) !important;
            border: 2px solid #5ec932 !important;
            box-shadow: 0 4px 0 #1a3e0a !important;
        }
        .btn-continue {
            background: linear-gradient(180deg, #c9a020 0%, #8a6c10 100%) !important;
            border: 2px solid #e0b830 !important;
            box-shadow: 0 4px 0 #5a3e08 !important;
            color: #fff !important;
        }
        .btn-attack {
            background: linear-gradient(180deg, #c43a3a 0%, #8a2020 100%) !important;
            border: 2px solid #e85555 !important;
            box-shadow: 0 4px 0 #4a1010 !important;
        }
        .btn-defend {
            background: linear-gradient(180deg, #3a6ac4 0%, #20408a 100%) !important;
            border: 2px solid #5588e8 !important;
            box-shadow: 0 4px 0 #10204a !important;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 7px 8px;
            margin-bottom: 4px;
            backdrop-filter: blur(8px);
            border: 1px solid #6b8c42;
            gap: 3px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .header-item {
            text-align: center;
            color: #f0e6b2;
            font-size: 0.7rem;
            flex: 1;
            min-width: 40px;
        }
        .header-item span {
            display: block;
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }
        #simple-progress-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            padding: 7px 10px;
            margin: 3px 0;
            border: 1px solid #6b8c42;
            font-size: 0.85rem;
            color: #f0e6b2;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
            gap: 4px;
        }
        #simple-progress-bar span {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.85rem;
        }
        #btn-view-talents-inline {
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 12px;
            background: #4a6e2a;
            color: #f7e05e;
            border: 2px solid #8bb84e;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }
        #output-area {
            flex: 1;
            background: var(--output-bg);
            border-radius: 14px;
            padding: 10px;
            overflow-y: auto;
            margin: 3px 0;
            font-size: 0.85rem;
            line-height: 1.6;
            border: 1px solid #4a6b3a;
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.6);
            color: #f0e6b2;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            min-height: 120px;
        }
        .msg {
            padding: 4px 0;
            border-bottom: 1px dotted #4a6b3a;
        }
        .goal {
            color: #4dff4d;
            font-weight: bold;
            text-shadow: 0 0 8px #33cc33;
            font-size: 0.9rem;
        }
        .miss {
            color: #ff6666;
            font-weight: bold;
        }
        .crit {
            color: #ffaa44;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .info {
            color: #d0d8c0;
        }
        .phase {
            color: #fff;
            background: #3a5e2a;
            border-radius: 14px;
            padding: 3px 12px;
            display: inline-block;
            margin: 4px 0;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .big-result {
            font-size: 1.4rem;
            font-weight: 900;
            padding: 8px 0;
            text-align: center;
            letter-spacing: 1px;
        }
        .big-result.player-win {
            color: #4dff4d;
            text-shadow: 0 0 14px #33cc33;
        }
        .big-result.opponent-win {
            color: #ff4444;
            text-shadow: 0 0 14px #cc2222;
        }
        #controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 5px 0;
            position: relative;
            z-index: 2;
        }
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 6px 0;
            flex-wrap: wrap;
        }
        .dice-box {
            font-size: 2rem;
            font-weight: bold;
            color: #f5e56c;
            text-align: center;
            padding: 8px;
            min-width: 55px;
            background: #0a130a;
            border-radius: 10px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .dice-box.highlight {
            background: #5a4a1a;
            color: #ffd966;
            box-shadow: 0 0 16px #ff9900;
            border: 2px solid #ffcc00;
            transform: scale(1.08);
        }
        .vs-display {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            background: #1e2e1e;
            border-radius: 8px;
            padding: 8px;
            margin: 6px 0;
            color: #f0e6b2;
            font-size: 0.9rem;
            text-align: center;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeIn 0.25s ease;
        }
        .goal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 30px black;
            text-align: center;
            padding: 20px;
        }
        .life-loss {
            animation: flashRed 0.5s ease 2;
        }
        @keyframes flashRed {
            0%,
            100% {
                color: #ff4444;
            }
            50% {
                color: #ffffff;
            }
        }
        .result-card {
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #f7e05e;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            width: 82%;
            margin-bottom: 14px;
        }
        .result-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 8px 0;
        }
        .result-label {
            color: #f0e6b2;
            font-size: 1.1rem;
        }
        .progress-item,
        .shop-item {
            background: rgba(46, 90, 30, 0.9);
            border: 2px solid #8bb84e;
            border-radius: 12px;
            padding: 12px;
            margin: 6px auto;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            color: #fff;
            align-self: center;
            cursor: pointer;
        }
        .progress-item:active,
        .shop-item:active {
            transform: scale(0.98);
        }
        .item-left {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            color: #f7e05e;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .item-desc {
            color: #e0d7b0;
            font-size: 0.73rem;
            word-break: break-word;
        }
        .item-price {
            color: #ffd966;
            font-weight: bold;
            white-space: nowrap;
            font-size: 0.85rem;
        }
        .alloc-row {
            display: flex;
            justify-content: space-between;
            width: 80%;
            margin: 10px 0;
            align-items: center;
        }
        .alloc-label {
            color: #f7e05e;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .alloc-val {
            color: #fff;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
            font-size: 1.3rem;
        }
        .points-left {
            color: #fff;
            margin-bottom: 14px;
            font-size: 1.1rem;
        }
        .talent-panel {
            background: rgba(10, 25, 10, 0.95);
            border-radius: 14px;
            padding: 16px;
            width: 80%;
            max-height: 60%;
            overflow-y: auto;
            text-align: center;
        }
        .talent-entry {
            margin: 8px 0;
            color: #f5e7b3;
        }
        .talent-entry .talent-name {
            font-weight: bold;
            color: #ffd966;
            font-size: 1rem;
        }
        .shop-category-tag {
            display: inline-block;
            background: #3a5e2a;
            color: #f7e05e;
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 0.7rem;
            margin-right: 4px;
        }
        .tactics-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            padding: 10px 14px;
            margin: 6px 0;
            background: rgba(30, 50, 20, 0.9);
            border: 2px solid #6b8c42;
            border-radius: 14px;
            cursor: pointer;
            color: #f0e6b2;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.1s;
        }
        .tactics-option:active {
            background: #4a6e2a;
            transform: scale(0.97);
        }
        .tactics-option .tactics-icon {
            font-size: 1.6rem;
        }
        .tactics-result {
            font-size: 1.3rem;
            font-weight: 900;
            text-align: center;
            padding: 10px;
            animation: fadeIn 0.5s ease;
            color: #f7e05e;
        }
        @media (max-width: 380px) {
            .header-item {
                font-size: 0.62rem;
            }
            .header-item span {
                font-size: 1rem;
            }
            .btn {
                font-size: 0.78rem;
                padding: 8px 10px;
            }
            #simple-progress-bar span {
                font-size: 0.75rem;
            }
            .goal-overlay {
                font-size: 2rem;
            }
            .result-score {
                font-size: 2rem;
            }
            .dice-box {
                font-size: 1.6rem;
                min-width: 44px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 封面 -->
        <div id="cover-panel" class="fullscreen-panel">
            <div class="title">⚽ 冠军之路</div>
            <div class="subtitle">文字 Roguelike 足球游戏</div>
            <input type="text" id="player-name-input" class="input-name" placeholder="输入你的名字" maxlength="12">
            <button class="btn btn-confirm" id="btn-start-game">开始生涯</button>
        </div>

        <!-- 玩法介绍面板 -->
        <div id="intro-panel" class="fullscreen-panel hidden-panel">
            <div style="font-size:1.6rem;color:#f7e05e;margin-bottom:8px;">📖 玩法简介</div>
            <div style="color:#f0e6b2;font-size:0.85rem;text-align:center;max-width:85%;line-height:1.7;max-height:55vh;overflow-y:auto;">
                <p>🎲 <b>D20骰子</b>决定比赛走向</p>
                <p>⚔️ 每回合轮流<b>进攻/防守</b></p>
                <p>✨ <b>技能</b>消耗体能，效果强力</p>
                <p>⭐ <b>天赋</b>提供被动加成</p>
                <p>📈 赛前选择<b>战术</b>克制对手</p>
                <p>🏆 赢够6场晋级，胜场不足降级</p>
                <p>💀 生命归零则生涯结束</p>
                <p style="color:#ffd966;margin-top:6px;">🔄 战术克制：高位压迫→控球→摆大巴→防守反击→高位压迫</p>
            </div>
            <button class="btn btn-confirm" id="btn-close-intro" style="margin-top:14px;">确认，开始分配属性</button>
        </div>

        <!-- 属性分配 -->
        <div id="alloc-panel" class="fullscreen-panel hidden-panel">
            <div style="font-size:1.6rem;color:#f7e05e;margin-bottom:8px;">⚖️ 分配属性</div>
            <div class="points-left">剩余点数: <span id="points-remaining">3</span></div>
            <div class="alloc-row">
                <span class="alloc-label">⚔️ 进攻</span>
                <button class="btn" id="atk-minus">-</button>
                <span id="atk-alloc" class="alloc-val">5</span>
                <button class="btn" id="atk-plus">+</button>
            </div>
            <div class="alloc-row">
                <span class="alloc-label">🛡️ 防守</span>
                <button class="btn" id="def-minus">-</button>
                <span id="def-alloc" class="alloc-val">5</span>
                <button class="btn" id="def-plus">+</button>
            </div>
            <button class="btn btn-confirm" id="btn-confirm-alloc" style="margin-top:16px;">确认</button>
        </div>

        <!-- 技能选择 -->
        <div id="skill-select-panel" class="fullscreen-panel hidden-panel">
            <div style="font-size:1.6rem;color:#f7e05e;margin-bottom:8px;">✨ 选择初始技能</div>
            <div id="skill-options" style="width:90%;"></div>
        </div>

        <!-- 天赋查看 -->
        <div id="talent-view-panel" class="fullscreen-panel hidden-panel">
            <div style="font-size:1.6rem;color:#f7e05e;margin-bottom:8px;">⭐ 我的天赋</div>
            <div id="talent-list" style="width:80%;text-align:center;"></div>
            <button class="btn" id="btn-close-talents" style="margin-top:14px;">关闭</button>
        </div>

        <!-- 战术选择面板 -->
        <div id="tactics-panel" class="fullscreen-panel hidden-panel">
            <div style="font-size:1.5rem;color:#f7e05e;margin-bottom:6px;">📋 赛前战术布置</div>
            <div style="color:#f0e6b2;font-size:0.8rem;margin-bottom:10px;text-align:center;">选择你的战术（电脑将随机选择）</div>
            <div id="tactics-options-container" style="width:90%;"></div>
        </div>

        <!-- Header -->
        <div id="header">
            <div class="header-item">⚔️进攻 <span id="atk-val">5</span></div>
            <div class="header-item">🛡️防守 <span id="def-val">5</span></div>
            <div class="header-item">⚡体能 <span id="stam-val">20/20</span></div>
            <div class="header-item">📈士气 <span id="morale-val">0</span> <span id="morale-emoji"></span></div>
        </div>

        <!-- 进度条+天赋按钮 -->
        <div id="simple-progress-bar">
            <span>🏆<span id="league-phase-display">乙级联赛</span></span>
            <span>📊<span id="match-progress-display">第1场 1/10</span></span>
            <span>❤️<span id="lives-display">3</span></span>
            <span>📖<span id="exp-display">50</span></span>
            <button id="btn-view-talents-inline">⭐天赋</button>
        </div>

        <!-- 输出区 -->
        <div id="output-area"></div>

        <!-- 控制区 -->
        <div id="controls"></div>
    </div>

    <script>
        (function() {
            // ==================== 音效 ====================
            const soundWhistle = new Audio('./assets/whistle.wav');
            const soundCheer = new Audio('./assets/cheer.wav');
            const soundFail = new Audio('./assets/fail.wav');
            // 预加载
            [soundWhistle, soundCheer, soundFail].forEach(s => {
                s.load();
                s.volume = 0.7;
            });

            function playSound(sound) {
                try {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                } catch (e) {}
            }

            // ==================== 数据定义 ====================
            const LEAGUE_NAMES = ['乙级联赛', '甲级联赛', '冠军联赛', '超级联赛'];
            const TACTICS = [
                { id: 'press', name: '高位压迫', icon: '🏃💨', desc: '前场疯狂逼抢，压制出球',
                    beats: 'possession' },
                { id: 'possession', name: '控球', icon: '🔄⚽', desc: '耐心传导，掌控节奏', beats: 'parkbus' },
                { id: 'parkbus', name: '摆大巴', icon: '🚌🧱', desc: '全员退守，铁桶阵', beats: 'counter' },
                { id: 'counter', name: '防守反击', icon: '⚡🏹', desc: '诱敌深入，快速反击', beats: 'press' },
            ];

            const TALENTS = [
                { id: 'fox', name: '禁区之狐', desc: '射门时进攻+1', price: 65 },
                { id: 'counter_talent', name: '反击嗅觉', desc: '防守成功后士气额外+1', price: 60 },
                { id: 'iron', name: '钢铁意志', desc: '士气不会低于-1', price: 55 },
                { id: 'clutch', name: '绝杀血脉', desc: '比赛最后3回合进攻+1', price: 75 },
                { id: 'lung', name: '铁肺', desc: '体能上限+4', price: 60 },
                { id: 'passing', name: '精准调度', desc: '突破检定时进攻+1', price: 60 },
                { id: 'wall', name: '铜墙铁壁', desc: '防守回合防守+1', price: 55 },
                { id: 'poacher', name: '抢点本能', desc: '突破成功后射门额外+1', price: 70 },
            ];

            const SKILLS = [
                { id: 'cannon', name: '重炮轰门', cost: 5, desc: '射门时双骰取高(优势)', target: 'shot',
                effect: 'advantage', price: 85 },
                { id: 'wallSkill', name: '血肉长城', cost: 4, desc: '防守回合防守+4', target: 'defend',
                effect: 'defUp4', price: 75 },

                }
                get staminaBonus() { return this.talents.some(t => t.id === 'lung') ? 4 : 0; }
                get effectiveMaxStamina() { return this.maxStamina + this.staminaBonus; }
                resetForMatch() {
                    this.maxStamina = 20 + (this.talents.some(t => t.id === 'lung') ? 4 : 0);
                    let startMorale = 0;
                    this.consumables.forEach((c, idx) => {
                        if (c.id === 'spray' && !this.match?.usedConsumables?.includes(idx)) {
                            startMorale += 2;
                        }
                    });
                    this.stamina = this.effectiveMaxStamina;
                    this.morale = startMorale;
                    this.usedCharmThisMatch = false;
                    if (startMorale > 0) appendOutput(`🧪 战前动员生效：开局士气+${startMorale}`, 'info');
                    this.match = {
                        score: [0, 0],
                        currentTurn: 0,
                        maxTurns: 10,
                        firstAttack: null,
                        turnOrder: [],
                        lastBreakSuccess: false,
                        moraleLocked: false,
                        usedConsumables: [],
                        opponent: null,
                        opponentSkillUsed: false,
                        opponentSkillName: '',
                    };
                }
                adjustMorale(delta) {
                    if (this.match?.moraleLocked && delta < 0) return;
                    let old = this.morale;
                    this.morale = Math.min(5, Math.max(-2, this.morale + delta));
                    if (this.talents.some(t => t.id === 'iron') && this.morale < -1) this.morale = -1;
                    if (this.morale !== old && this.match) {
                        let emoji = delta > 0 ? '💪' : '😞';
                        if (this.morale >= 4) emoji = '🔥';
                        else if (this.morale <= -2) emoji = '😰';
                        appendOutput(`士气 ${delta>0?'+'+delta:delta} → ${this.morale} ${emoji}`, 'info');
                    }
                    updateUI();
                }
            }

            async function rollD20Quick(label, advantage = false) {
                isAnimating = true;
                disableAllButtons();
                let finalVal = 0;
                let isReroll = false;
                const doRoll = async () => {
                    let r1 = Math.floor(Math.random() * 20) + 1;
                    let r2 = Math.floor(Math.random() * 20) + 1;
                    let val = r1;
                    const diceArea = document.createElement('div');
                    diceArea.className = 'dice-area fade-in';
                    outputArea.appendChild(diceArea);
                    const box1 = document.createElement('div');
                    box1.className = 'dice-box';
                    box1.textContent = '🎲?';
                    diceArea.appendChild(box1);
                    if (advantage) {
                        const box2 = document.createElement('div');
                        box2.className = 'dice-box';
                        box2.textContent = '🎲?';
                        diceArea.appendChild(box2);
                        outputArea.scrollTop = outputArea.scrollHeight;
                        let step = 0,
                            maxSteps = 8;
                        await new Promise(resolve => {
                            const doStep = () => {
                                box1.textContent = `🎲${Math.floor(Math.random()*20)+1}`;
                                box2.textContent = `🎲${Math.floor(Math.random()*20)+1}`;
                                step++;
                                if (step >= maxSteps) setTimeout(resolve, 200);
                                else setTimeout(doStep, 50 + step * 30);
                            };
                            doStep();
                        });
                        box1.textContent = `🎲${r1}`;
                        box2.textContent = `🎲${r2}`;
                        val = Math.max(r1, r2);
                        if (r1 >= r2) box1.classList.add('highlight');
                        else box2.classList.add('highlight');
                        await new Promise(r => setTimeout(r, 500));
                        appendOutput(`✨ 优势双骰取高：${label} = <b>${val}</b>（骰子）`, 'info');
                    } else {
                        outputArea.scrollTop = outputArea.scrollHeight;
                        let step = 0,
                            maxSteps = 6;
                        await new Promise(resolve => {
                            const doStep = () => {
                                box1.textContent = `🎲${Math.floor(Math.random()*20)+1}`;
                                step++;
                                if (step >= maxSteps) setTimeout(resolve, 100);
                                else setTimeout(doStep, 50 + step * 30);
                            };
                            doStep();
                        });
                        box1.textContent = `🎲${val}`;
                        await new Promise(r => setTimeout(r, 400));
                        appendOutput(`${label} 掷出 <b>${val}</b>（骰子）`, 'info');
                    }
                    return val;
                };
                finalVal = await doRoll();
                if (finalVal === 1 && !isReroll && !player.usedCharmThisMatch) {
                    const charmIndex = player.consumables.findIndex(c => c.id === 'charm');
                    if (charmIndex !== -1) {
                        player.consumables.splice(charmIndex, 1);
                        player.usedCharmThisMatch = true;
                        appendOutput(`🍀 幸运符触发！抵消大失败，重掷！`, 'crit');
                        isReroll = true;
                        finalVal = await doRoll();
                    }
                }
                if (finalVal === 20) appendOutput(`${label} 🌟大成功！`, 'crit');
                else if (finalVal === 1) appendOutput(`${label} 💥大失败！`, 'crit');
                isAnimating = false;
                return finalVal;
            }

            function getOpponentStats() {
                const league = player.currentLeague;
                if (league === 0) return { attack: rand(3, 5), defense: rand(4, 6) };
                if (league === 1) return { attack: rand(5, 8), defense: rand(7, 10) };
                if (league === 2) return { attack: rand(9, 13), defense: rand(10, 15) };
                return { attack: rand(14, 19), defense: rand(13, 18) };
            }

            function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

            function getOpponentSkill() {
                const league = player.currentLeague;
                const skills = OPPONENT_SKILLS[Math.min(league, 3)] || OPPONENT_SKILLS[0];
                const roll = Math.random();
                let cumulative = 0;
                for (const sk of skills) {
                    cumulative += sk.chance;
                    if (roll <= cumulative) return sk;
                }
                return null;
            }

            function applyPassives(phase, base, log = true) {
                let v = base;
                const triggered = [];
                if (phase === 'break' && player.talents.some(t => t.id === 'passing')) { v += 1;
                    triggered.push('精准调度'); }
                if (phase === 'defend' && player.talents.some(t => t.id === 'wall')) { v += 1;
                    triggered.push('铜墙铁壁'); }
                if (phase === 'shot' && player.talents.some(t => t.id === 'fox')) { v += 1;
                    triggered.push('禁区之狐'); }
                if (phase === 'shot' && player.talents.some(t => t.id === 'poacher') && player.match
                    ?.lastBreakSuccess) { v += 1;
                    triggered.push('抢点本能'); }
                if (log) triggered.forEach(tn => appendOutput(`⭐ 天赋【${tn}】发动！`, 'info'));
                return v;
            }

            function checkClutch() {
                if (!player.talents.some(t => t.id === 'clutch')) return false;
                if (!player.match) return false;
                return player.match.currentTurn >= 7;

            function generateShopSlots() {
                const count = rand(2, 3);
                const candidates = [];
                for (let i = 1; i <= 8; i++) candidates.push(i);
                // 随机打乱
                for (let i = candidates.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                }
                const selected = [];
                for (const idx of candidates) {
                    if (selected.length >= count) break;
                    if (!selected.some(s => Math.abs(s - idx) <= 1)) selected.push(idx);
                }
                selected.sort((a, b) => a - b);
                player.shopSlots = selected;
                player.leagueProgressSlots = [];
                // 仍然生成进步槽位
                const progCount = rand(1, 2);
                const progCandidates = [];
                for (let i = 1; i <= 8; i++) {
                    if (!selected.includes(i)) progCandidates.push(i);
                }
                for (let i = progCandidates.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [progCandidates[i], progCandidates[j]] = [progCandidates[j], progCandidates[i]];
                }
                const progSelected = progCandidates.slice(0, Math.min(progCount, progCandidates.length));
                player.leagueProgressSlots = progSelected.map(idx => ({
                    index: idx,
                    claimed: false,
                    item: { type: 'alloc_point', name: '可分配属性点', desc: '选择进攻或防守+1' },
                }));
            }

            function generateShopItems() {
                const items = [];
                const availableTalents = TALENTS.filter(t => !player.talents.some(pt => pt.id === t.id));
                const shuffledTalents = [...availableTalents].sort(() => 0.5 - Math.random()).slice(0, 2);
                shuffledTalents.forEach(t => items.push({ type: 'talent', data: t, price: t.price }));
                const availableSkills = SKILLS.filter(s => !player.skills.some(ps => ps.id === s.id));
                const shuffledSkills = [...availableSkills].sort(() => 0.5 - Math.random()).slice(0, 2);
                shuffledSkills.forEach(s => items.push({ type: 'skill', data: s, price: s.price }));
                const shuffledConsumables = [...CONSUMABLES].sort(() => 0.5 - Math.random()).slice(0, 1);
                shuffledConsumables.forEach(c => items.push({ type: 'consumable', data: c, price: c.price }));
                return items;
            }

            function addConsumable(item) {
                const max = item.max || 99;
                const currentCount = player.consumables.filter(c => c.id === item.id).length;
                if (currentCount >= max) {
                    appendOutput(`${item.name} 已达上限(${max})，补偿8经验。`, 'info');
                    player.exp += 8;
                    return false;
                }
                player.consumables.push(item);
                return true;
            }

                        <div class="item-desc">${item.data.desc||''}</div>
                    </div>
                    <div class="item-price">${item.price} EXP</div>
                `;
                    div.onclick = () => {
                        if (player.exp >= item.price) {
                            player.exp -= item.price;
                            if (item.type === 'talent') player.talents.push(item.data);
                            else if (item.type === 'skill') player.skills.push(item.data);
                            else if (item.type === 'consumable') {
                                if (!addConsumable(item.data)) return;
                            }
                            appendOutput(`✅ 购买了 ${item.data.name}！`, 'goal');
                            player.currentShopItems.splice(index, 1);
                            updateUI();
                            renderProgressAndShop();
                        } else {
                            appendOutput('经验不足！', 'miss');
                        }
                    };
                    outputArea.appendChild(div);
                });
                const refreshCost = 20;
                const buttons = [];
                buttons.push({ text: `🔄 刷新商品 (${refreshCost}EXP)`, action: () => {
                        if (player.exp >= refreshCost) {

                buttons.push({ text: '⚽ 下一场比赛', action: () => {

                            openAllocPanel(() => { showTacticsPanel(); });

                setControls(buttons);

                document.getElementById('def-minus').disabled = tempDef <= player.defense;
                document.getElementById('btn-confirm-alloc').disabled = allocPoints > 0;

                const ot = player.opponentTactics;
                appendOutput(`📋 战术对决`, 'phase');
                appendOutput(`你选择了：<b>${pt.icon} ${pt.name}</b>`, 'info');
                appendOutput(`电脑选择了：<b>${ot.icon} ${ot.name}</b>`, 'info');
                // 判断克制关系
                let playerWinsTactics = false;
                let drawTactics = false;
                if (pt.id === ot.id) {
                    drawTactics = true;
                } else if (pt.beats === ot.id) {
                    playerWinsTactics = true;
                }
                // 动画展示
                const resultDiv = document.createElement('div');
                resultDiv.className = 'tactics-result fade-in';
                if (drawTactics) {
                    resultDiv.textContent = '🤝 战术相同，双方均无加成';
                    player.tacticsBonus = 0;
                } else if (playerWinsTactics) {
                    resultDiv.textContent = `✅ 战术克制！${pt.name} 克制 ${ot.name}！`;
                    player.tacticsBonus = 2;
                    appendOutput(`💪 你的战术克制对手！全场进攻&防守+${player.tacticsBonus}`, 'goal');
                } else {
                    resultDiv.textContent = `❌ 战术被克制！${ot.name} 克制 ${pt.name}！`;
                    player.tacticsBonus = -1;
                    appendOutput(`😞 战术被对手克制，对手获得优势`, 'miss');
                }
                outputArea.appendChild(resultDiv);
                outputArea.scrollTop = outputArea.scrollHeight;
                // 短暂停顿后开始比赛
                setControls([{ text: '⚽ 开始比赛', action: () => { startMatch(); }, btnClass: 'btn-continue' }]);
            }

            async function startMatch() {
                player.resetForMatch();
                updateUI();
                playSound(soundWhistle);
                let opp = getOpponentStats();
                player.match.opponent = opp;
                let roll = Math.floor(Math.random() * 20) + 1;
                player.match.firstAttack = roll > 10 ? 'player' : 'opponent';
                let order = [];
                for (let i = 0; i < 10; i++)
                    order.push(i % 2 === 0 ? player.match.firstAttack : (player.match.firstAttack === 'player' ?
                        'opponent' : 'player'));
                player.match.turnOrder = order;
                player.match.opponentSkillUsed = false;
                player.match.opponentSkillName = '';
                clearOutput();
                appendOutput(`📢 对手 攻${opp.attack} 防${opp.defense}`, 'phase');
                appendOutput(`先攻：${player.match.firstAttack==='player'?'你':'对手'}`);
                if (player.tacticsBonus !== 0) {
                    appendOutput(`📋 战术影响：${player.tacticsBonus>0?'你获得+'+player.tacticsBonus+'全场加成':'对手获得优势'}`, 'info');
                }
                await processTurn();
            }

            async function processTurn() {
                if (!player.match || player.match.currentTurn >= 10) { await endMatch(); return; }
                let attacker = player.match.turnOrder[player.match.currentTurn];
                if (attacker === 'player') await playerTurn();
                else await opponentTurn();
            }

            async function playerTurn() {
                updateUI();
                clearOutput();
                appendOutput(`⚡ 第${player.match.currentTurn+1}回合：你的进攻`, 'phase');
                appendOutput(
                    `比分 ${player.match.score[0]}:${player.match.score[1]} | 士气${player.morale} | 体能${player.stamina}`);
                let buttons = [{ text: '🏃 突破', action: async () => { await playerBreak(); }, btnClass: 'btn-attack' }];
                player.skills.forEach(s => {
                    if ((s.target === 'break' || s.target === 'any') && player.stamina >= s.cost)
                        buttons.push({ text: `✨ ${s.name}(${s.cost}体)`, action: async () => { await useSkill(s); },
                            btnClass: 'btn-attack' });
                });
                player.consumables.forEach((c, i) => {
                    if (c.type !== 'passive' && !player.match.usedConsumables.includes(i))
                        buttons.push({ text: `🧪 ${c.name}`, action: async () => { await useConsumable(i); },
                            btnClass: '' });
                });
                setControls(buttons);
            }

            async function playerBreak(skillEffect = null) {
                if (skillEffect === 'autoSuccess') {
                    appendOutput('💫 反越位成功！直面门将！', 'crit');
                    player.match.lastBreakSuccess = true;
                    await showShotOptions();
                    return;
                }
                let adv = checkClutch();
                if (adv) appendOutput('🔥 绝杀血脉发动！', 'info');
                let roll = await rollD20Quick('你', adv);
                if (roll === 20) {
                    player.adjustMorale(1);
                    showBigResult('🌟 完美突破！20(骰子)=突破成功', true);
                    player.match.lastBreakSuccess = true;
                    await new Promise(r => setTimeout(r, 800));
                    await showShotOptions();
                    return;
                } else if (roll === 1) {
                    player.adjustMorale(-1);
                    showBigResult('💥 突破失误...1(骰子)=失败', false);
                    player.match.lastBreakSuccess = false;
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                }
                let breakBonus = applyPassives('break', player.attack);
                if (skillEffect === 'atkUp3') breakBonus += 3;
                if (player.tacticsBonus > 0) breakBonus += player.tacticsBonus;
                let total = roll + breakBonus + player.morale;
                appendOutput(`对手防守...`);
                await new Promise(r => setTimeout(r, 600));
                let oppRoll = await rollD20Quick('对手');
                if (oppRoll === 20) {
                    player.adjustMorale(-1);
                    showBigResult('🌟 对手完美防守！20(骰子)=防守成功', false);
                    player.match.lastBreakSuccess = false;
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                } else if (oppRoll === 1) {
                    player.adjustMorale(1);
                    showBigResult('💥 对手失误！突破成功', true);
                    player.match.lastBreakSuccess = true;
                    await new Promise(r => setTimeout(r, 800));
                    await showShotOptions();
                    return;
                }
                let oppTotal = oppRoll + player.match.opponent.defense;
                if (player.tacticsBonus < 0) oppTotal += Math.abs(player.tacticsBonus);
                showVs(`<b style="color:#4dff4d">${total}</b> (突破:${roll}骰+攻${breakBonus}+士气${player.morale})`,
                    `<b style="color:#ff6666">${oppTotal}</b> (防守)`);
                if (total > oppTotal) {
                    showBigResult(`✅ 突破成功！${total} > ${oppTotal}`, true);
                    player.match.lastBreakSuccess = true;
                    await new Promise(r => setTimeout(r, 1000));
                    await showShotOptions();
                } else {
                    showBigResult(`❌ 被抢断。${total} ≤ ${oppTotal}`, false);
                    player.match.lastBreakSuccess = false;
                    await new Promise(r => setTimeout(r, 1000));
                    showContinueButton();
                }
            }

            async function showShotOptions() {
                let buttons = [{ text: '🥅 射门', action: async () => { await playerShot(); }, btnClass: 'btn-attack' }];
                player.skills.forEach(s => {
                    if ((s.target === 'shot' || s.target === 'any') && player.stamina >= s.cost)
                        buttons.push({ text: `✨ ${s.name}(${s.cost}体)`, action: async () => { await useSkillOnShot(
                                s); }, btnClass: 'btn-attack' });
                });
                setControls(buttons);
            }

            async function playerShot(skillEffect = null) {
                let adv = checkClutch() || (player.talents.some(t => t.id === 'poacher') && player.match
                    .lastBreakSuccess);
                if (player.talents.some(t => t.id === 'poacher') && player.match.lastBreakSuccess) {
                    appendOutput('⚡ 抢点本能发动！', 'info');
                }
                if (skillEffect === 'advantage') adv = true;
                let roll = await rollD20Quick('你', adv);
                if (roll === 20) {
                    player.adjustMorale(2);
                    showBigResult('🌟 世界波！20(骰子)=进球！！！', true);
                    showGoalAnimation(true);
                    player.match.score[0]++;
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                } else if (roll === 1) {
                    player.adjustMorale(-1);
                    showBigResult('💥 打飞了...1(骰子)=射失', false);
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                }
                let shotBonus = applyPassives('shot', player.attack);
                if (player.tacticsBonus > 0) shotBonus += player.tacticsBonus;
                let total = roll + shotBonus + player.morale;
                appendOutput(`门将扑救...`);
                await new Promise(r => setTimeout(r, 600));
                let oppRoll = await rollD20Quick('门将');
                if (oppRoll === 20) {
                    player.adjustMorale(-1);
                    showBigResult('🌟 神扑！20(骰子)=扑救成功', false);
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                } else if (oppRoll === 1) {
                    player.adjustMorale(2);
                    showBigResult('💥 门将失误！进球！', true);
                    showGoalAnimation(true);
                    player.match.score[0]++;
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                }
                let oppDef = player.match.opponent.defense;
                if (skillEffect === 'reduceOppDef2') oppDef -= 2;
                if (player.tacticsBonus < 0) oppDef += Math.abs(player.tacticsBonus);
                let oppTotal = oppRoll + oppDef;
                showVs(`<b style="color:#4dff4d">${total}</b> (射门:${roll}骰+攻${shotBonus}+士气${player.morale})`,
                    `<b style="color:#ff6666">${oppTotal}</b> (扑救)`);
                if (total > oppTotal) {
                    showBigResult(`⚽🥅 进球了！${total} > ${oppTotal}`, true);
                    showGoalAnimation(true);
                    player.match.score[0]++;
                    player.adjustMorale(2);
                } else {
                    showBigResult(`😞 被扑出。${total} ≤ ${oppTotal}`, false);
                }
                await new Promise(r => setTimeout(r, 1000));
                showContinueButton();
            }

            async function opponentTurn() {
                clearOutput();
                appendOutput(`🛡️ 第${player.match.currentTurn+1}回合：对手进攻`, 'phase');
                appendOutput(
                    `比分 ${player.match.score[0]}:${player.match.score[1]} | 士气${player.morale} | 体能${player.stamina}`);
                // 电脑可能使用技能
                const oppSkill = getOpponentSkill();
                if (oppSkill && !player.match.opponentSkillUsed && player.match.currentTurn >= 3) {
                    player.match.opponentSkillUsed = true;
                    player.match.opponentSkillName = oppSkill.name;
                    appendOutput(`⚠️ 电脑施展技能：【${oppSkill.name}】- ${oppSkill.desc}`, 'crit');
                }
                let buttons = [{ text: '🛡️ 防守', action: async () => { await opponentAttack(oppSkill); },
                    btnClass: 'btn-defend' }];
                player.skills.forEach(s => {
                    if ((s.target === 'defend' || s.target === 'defendShot' || s.target === 'any') && player
                        .stamina >= s.cost)
                        buttons.push({ text: `✨ ${s.name}(${s.cost}体)`, action: async () => {
                                await useSkillOnDefense(s, oppSkill);
                            }, btnClass: 'btn-defend' });
                });
                setControls(buttons);
            }

            async function opponentAttack(oppSkill = null, playerSkill = null) {
                let adv = checkClutch();
                if (adv) appendOutput('🔥 绝杀血脉发动！', 'info');
                let defBonus = applyPassives('defend', player.defense);
                if (playerSkill?.effect === 'defUp4' || playerSkill?.effect === 'blockAdvantage') defBonus += 4;
                if (playerSkill?.effect === 'blockAdvantage') adv = true;
                if (player.tacticsBonus > 0) defBonus += player.tacticsBonus;
                // 电脑技能影响
                let oppAtkBonus = 0;
                let oppAdv = false;
                let oppAutoBreak = false;
                if (oppSkill) {
                    if (oppSkill.effect === 'defUp2') { /* 电脑防守时用，这里不适用 */ }
                    if (oppSkill.effect === 'defUp3') { /* 电脑防守时用 */ }
                    if (oppSkill.effect === 'defUp4') { /* 电脑防守时用 */ }
                    if (oppSkill.effect === 'defAdvantage') { /* 电脑防守时用 */ }
                    if (oppSkill.effect === 'defAdvantageStrong') { /* 电脑防守时用 */ }
                    if (oppSkill.effect === 'atkUp1') oppAtkBonus += 1;
                    if (oppSkill.effect === 'atkUp2') oppAtkBonus += 2;
                    if (oppSkill.effect === 'atkAdvantage') { oppAtkBonus += 3;
                        oppAdv = true; }
                    if (oppSkill.effect === 'atkAdvantageStrong') { oppAtkBonus += 4;
                        oppAdv = true; }
                    if (oppSkill.effect === 'autoBreak') oppAutoBreak = true;
                    if (oppSkill.effect === 'autoBreakShot') oppAutoBreak = true;
                }
                if (oppAutoBreak) {
                    appendOutput('💥 电脑完美突破！', 'miss');
                    await oppShot(oppSkill);
                    return;
                }
                let roll = await rollD20Quick('对手', oppAdv);
                if (roll === 20) {
                    player.adjustMorale(-1);
                    showBigResult('🌟 对手犀利突破！20(骰子)', false);
                    await new Promise(r => setTimeout(r, 800));
                    await oppShot(oppSkill);
                    return;
                } else if (roll === 1) {
                    player.adjustMorale(1);
                    showBigResult('💥 对手失误！断球！', true);
                    if (player.talents.some(t => t.id === 'counter_talent')) {
                        player.adjustMorale(1);
                        appendOutput('📯 反击嗅觉：士气额外+1', 'info');
                    }
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                }
                let oppTotal = roll + player.match.opponent.attack + oppAtkBonus;
                if (player.tacticsBonus < 0) oppTotal += Math.abs(player.tacticsBonus);
                appendOutput(`你防守...`);
                await new Promise(r => setTimeout(r, 600));
                let defRoll = await rollD20Quick('你', adv);
                if (defRoll === 20) {
                    player.adjustMorale(1);
                    showBigResult('🌟 完美防守！20(骰子)', true);
                    if (player.talents.some(t => t.id === 'counter_talent')) {
                        player.adjustMorale(1);
                        appendOutput('📯 反击嗅觉：士气额外+1', 'info');
                    }
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                } else if (defRoll === 1) {
                    player.adjustMorale(-1);
                    showBigResult('💥 防守失误！1(骰子)', false);
                    await new Promise(r => setTimeout(r, 800));
                    await oppShot(oppSkill);
                    return;
                }
                let defTotal = defRoll + defBonus + player.morale;
                showVs(`<b style="color:#ff6666">${oppTotal}</b> (对手突破:${roll}骰+攻${player.match.opponent.attack+oppAtkBonus})`,
                    `<b style="color:#4dff4d">${defTotal}</b> (防守:${defRoll}骰+防${defBonus}+士气${player.morale})`);
                if (defTotal > oppTotal) {
                    showBigResult(`💪 断球成功！${defTotal} > ${oppTotal}`, true);
                    if (player.talents.some(t => t.id === 'counter_talent')) {
                        player.adjustMorale(1);
                        appendOutput('📯 反击嗅觉：士气额外+1', 'info');
                    }
                    await new Promise(r => setTimeout(r, 1000));
                    showContinueButton();
                } else {
                    showBigResult(`⚠️ 对手突破！${defTotal} ≤ ${oppTotal}`, false);
                    await new Promise(r => setTimeout(r, 1000));
                    await oppShot(oppSkill);
                }
            }

            async function oppShot(oppSkill = null) {
                let oppAdv = false;
                let oppShotBonus = 0;
                if (oppSkill) {
                    if (oppSkill.effect === 'autoBreakShot') oppAdv = true;
                    if (oppSkill.effect === 'atkAdvantageStrong') oppShotBonus += 2;
                }
                let roll = await rollD20Quick('对手', oppAdv);
                if (roll === 20) {
                    player.adjustMorale(-2);
                    showBigResult('🌟 绝对死角...20(骰子)=进球', false);
                    showGoalAnimation(false);
                    player.match.score[1]++;
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                } else if (roll === 1) {
                    player.adjustMorale(1);
                    showBigResult('💥 打偏了！1(骰子)', true);
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                }
                let oppTotal = roll + player.match.opponent.attack + oppShotBonus;
                if (player.tacticsBonus < 0) oppTotal += Math.abs(player.tacticsBonus);
                appendOutput(`你扑救...`);
                await new Promise(r => setTimeout(r, 600));
                let defRoll = await rollD20Quick('你');
                if (defRoll === 20) {
                    player.adjustMorale(1);
                    showBigResult('🌟 神扑！20(骰子)', true);
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                } else if (defRoll === 1) {
                    player.adjustMorale(-1);
                    showBigResult('💥 扑救失误...1(骰子)=丢球', false);
                    showGoalAnimation(false);
                    player.match.score[1]++;
                    await new Promise(r => setTimeout(r, 800));
                    showContinueButton();
                    return;
                }
                let defTotal = defRoll + applyPassives('defend', player.defense, false) + player.morale;
                if (player.tacticsBonus > 0) defTotal += player.tacticsBonus;
                showVs(`<b style="color:#ff6666">${oppTotal}</b> (对手射门:${roll}骰+攻${player.match.opponent.attack+oppShotBonus})`,
                    `<b style="color:#4dff4d">${defTotal}</b> (扑救:${defRoll}骰+防${player.defense}+士气${player.morale})`);
                if (defTotal > oppTotal) {
                    showBigResult(`🧤 扑救成功！${defTotal} > ${oppTotal}`, true);
                } else {
                    showBigResult(`💔 球进了...${defTotal} ≤ ${oppTotal}`, false);
                    showGoalAnimation(false);
                    player.match.score[1]++;
                    player.adjustMorale(-1);
                }
                await new Promise(r => setTimeout(r, 1000));
                showContinueButton();
            }

            function showContinueButton() {
                player.match.currentTurn++;
                setControls([{ text: '继续', action: async () => { await processTurn(); },
                btnClass: 'btn-continue' }]);
            }

            async function endMatch() {
                updateUI();
                let win = player.match.score[0] > player.match.score[1];
                let draw = player.match.score[0] === player.match.score[1];
                const overlay = document.createElement('div');
                overlay.className = 'fullscreen-panel';
                overlay.style.zIndex = '50';
                let resultText = win ? '🏆 胜利' : (draw ? '🤝 平局' : '💔 失败');
                let resultColor = win ? '#ffd966' : (draw ? '#fff' : '#ff4444');
                let expGain = win ? 30 : (draw ? 20 : 10);
                overlay.innerHTML = `
                <div class="result-card">
                    <div class="result-label" style="color:${resultColor}">${resultText}</div>
                    <div class="result-score">${player.match.score[0]} - ${player.match.score[1]}</div>
                    <div style="margin-top:8px;font-size:0.85rem;color:#e0d7b0;">
                        ${win?'获得30经验':(draw?'获得20经验':'获得10经验，生命-1')}
                    </div>
                </div>
                <button class="btn btn-continue" id="btn-end-match-continue" style="text-align:center;width:60%;">继续</button>
            `;
                document.body.appendChild(overlay);
                player.exp += expGain;
                if (win) player.totalWins++;
                else if (!draw) {
                    player.totalLosses++;
                    player.lives--;
                    showLifeLossAnimation();
                }
                player.matchesPlayed++;
                player.tacticsBonus = 0;
                player.currentTactics = null;
                player.opponentTactics = null;
                updateUI();
                document.getElementById('btn-end-match-continue').onclick = () => {
                    overlay.remove();
                    if (player.lives <= 0) {
                        clearOutput();
                        appendOutput('💀 你的生涯结束了...', 'crit');
                        setControls([{ text: '🔄 重新开始', action: () => location.reload() }]);
                    } else {
                        if (player.matchesPlayed >= 10) {
                            handleLeagueProgress();
                        } else {
                            // 检查是否在商店槽位
                            if (player.shopSlots.includes(player.matchesPlayed)) {
                                player.currentShopItems = generateShopItems();
                                renderProgressAndShop();
                            } else {
                                // 检查是否有进步槽位
                                const progSlot = player.leagueProgressSlots.find(s => s.index === player
                                    .matchesPlayed && !s.claimed);
                                if (progSlot || player.unallocatedPoints > 0) {
                                    player.currentShopItems = [];
                                    renderProgressAndShop();
                                } else {
                                    // 直接下一场
                                    if (player.unallocatedPoints > 0) {
                                        openAllocPanel(() => { showTacticsPanel(); });
                                    } else {
                                        showTacticsPanel();
                                    }
                                }
                            }
                        }
                    }
                };
            }

            function handleLeagueProgress() {
                if (player.totalWins >= 6) {
                    if (player.currentLeague < 3) {
                        player.currentLeague++;
                        player.matchesPlayed = 0;
                        player.totalWins = 0;
                        player.totalLosses = 0;
                        player.exp += 50;
                        generateShopSlots();
                        player.currentShopItems = [];
                        appendOutput(`🎉 晋级！进入 ${LEAGUE_NAMES[player.currentLeague]}！`, 'goal');
                        updateUI();
                        if (player.shopSlots.includes(0)) {
                            player.currentShopItems = generateShopItems();
                            renderProgressAndShop();
                        } else if (player.unallocatedPoints > 0) {
                            openAllocPanel(() => { showTacticsPanel(); });
                        } else {
                            showTacticsPanel();
                        }
                    } else {
                        // 超级联赛循环（无尽模式）
                        appendOutput(`🌟 超级联赛循环！继续征战！`, 'goal');
                        player.matchesPlayed = 0;
                        player.totalWins = 0;
                        player.totalLosses = 0;
                        player.exp += 30;
                        generateShopSlots();
                        player.currentShopItems = [];
                        updateUI();
                        if (player.shopSlots.includes(0)) {
                            player.currentShopItems = generateShopItems();
                            renderProgressAndShop();
                        } else if (player.unallocatedPoints > 0) {
                            openAllocPanel(() => { showTacticsPanel(); });
                        } else {
                            showTacticsPanel();
                        }
                    }
                } else {
                    appendOutput(`😢 胜场不足(${player.totalWins}/10)，降级或维持...`, 'miss');
                    if (player.currentLeague > 0 && player.totalWins < 4) {
                        player.currentLeague--;
                        appendOutput(`降级到 ${LEAGUE_NAMES[player.currentLeague]}`, 'miss');
                    }
                    player.matchesPlayed = 0;
                    player.totalWins = 0;
                    player.totalLosses = 0;
                    generateShopSlots();
                    player.currentShopItems = [];
                    updateUI();
                    if (player.shopSlots.includes(0)) {
                        player.currentShopItems = generateShopItems();
                        renderProgressAndShop();
                    } else if (player.unallocatedPoints > 0) {
                        openAllocPanel(() => { showTacticsPanel(); });
                    } else {
                        showTacticsPanel();
                    }
                }
                updateUI();
            }

            async function useSkill(skill) {
                if (player.stamina < skill.cost) return;
                player.stamina -= skill.cost;
                updateUI();
                appendOutput(`✨ 使用了 ${skill.name}!`, 'info');
                await playerBreak(skill.effect);
            }

            async function useSkillOnShot(skill) {
                if (player.stamina < skill.cost) return;
                player.stamina -= skill.cost;
                updateUI();
                appendOutput(`✨ 使用了 ${skill.name}!`, 'info');
                await playerShot(skill.effect);
            }

            async function useSkillOnDefense(skill, oppSkill = null) {
                if (player.stamina < skill.cost) return;
                player.stamina -= skill.cost;
                updateUI();
                appendOutput(`✨ 使用了 ${skill.name}!`, 'info');
                await opponentAttack(oppSkill, skill);
            }

            async function useConsumable(index) {
                let c = player.consumables[index];
                player.match.usedConsumables.push(index);
                appendOutput(`🧪 使用了 ${c.name}`, 'info');
                if (c.id === 'drink') {
                    player.stamina = Math.min(player.stamina + 10, player.effectiveMaxStamina);
                    appendOutput(`体能恢复10 → ${player.stamina}`, 'info');
                }
                updateUI();
                if (player.match.turnOrder[player.match.currentTurn] === 'player') await playerTurn();
                else await opponentTurn();
            }

            // ==================== 事件绑定 ====================
            document.getElementById('btn-start-game').addEventListener('click', () => {
                const name = document.getElementById('player-name-input').value;
                player = new Player(name);
                coverPanel.classList.add('hidden-panel');
                introPanel.classList.remove('hidden-panel');
            });

            document.getElementById('btn-close-intro').addEventListener('click', () => {
                introPanel.classList.add('hidden-panel');
                tempAtk = 5;
                tempDef = 5;
                allocPoints = 3;
                updateAllocUI();
                allocPanel.classList.remove('hidden-panel');
            });

            // 初始分配确认后进入技能选择
            const origConfirmAlloc = document.getElementById('btn-confirm-alloc').onclick;
            document.getElementById('btn-confirm-alloc').addEventListener('click', function(e) {
                if (allocPoints > 0) return; // 还没分配完
                if (allocCallback) return; // 这是后续的分配，不是初始的
                player.attack = tempAtk;
                player.defense = tempDef;
                allocPanel.classList.add('hidden-panel');
                generateShopSlots();
                updateUI();
                showSkillSelectInitial();
            });

            function showSkillSelectInitial() {
                skillPanel.classList.remove('hidden-panel');
                const container = document.getElementById('skill-options');
                container.innerHTML = '';
                const shuffled = [...SKILLS].sort(() => 0.5 - Math.random()).slice(0, 3);
                shuffled.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.style.width = '100%';
                    btn.style.marginBottom = '10px';
                    btn.style.textAlign = 'center';
                    btn.innerHTML =
                        `<div>✨ ${s.name} (消耗:${s.cost}体)</div><div style="font-size:0.78rem;color:#e0d7b0;">${s.desc}</div>`;
                    btn.onclick = () => {
                        player.skills.push(s);
                        skillPanel.classList.add('hidden-panel');
                        gameState = 'playing';
                        updateUI();
                        showTacticsPanel();
                    };
                    container.appendChild(btn);
                });
            }
        })();
    </script>
</body>
</html>
